plugins {
    id 'com.android.application'
}

android {
    namespace 'com.httpcustom.clone'
    compileSdk 34

    defaultConfig {
        applicationId "com.httpcustom.clone"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    lint {
        abortOnError false
    }
}

dependencies {
    implementation 'com.github.mwiede:jsch:0.2.20'
}
